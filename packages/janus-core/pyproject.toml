[project]
name = "janus-core"
version = "0.1.0"
description = "Shared platform primitives: settings, ids, errors, logging, telemetry"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus_core"]
# py.typed makes the annotations visible to consumers of the built wheel.
artifacts = ["janus_core/py.typed"]
