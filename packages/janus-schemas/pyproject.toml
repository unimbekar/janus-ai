[project]
name = "janus-schemas"
version = "0.1.0"
description = "Shared API and domain contracts (OpenAI-compatible + Janus extensions)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus_schemas"]
# py.typed makes the annotations visible to consumers of the built wheel.
artifacts = ["janus_schemas/py.typed"]
