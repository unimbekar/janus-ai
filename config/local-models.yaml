# Local open-weight models for this machine.
#
# Used by:
#   ./setup.sh --local          (before stack-up)
#   ./install.sh start
#   ./install.sh ensure-models
#
# Catalog entries live under registry/models/*.yaml and must be enabled in
# registry/environments/local.yaml — this file only covers Ollama ensure/pull.
#
# Extra tags (merged with this list, not a replacement):
#   JANUS_LOCAL_OLLAMA_MODELS=some-other-tag:latest

ollama:
  # Used when probing/pulling from the host. Compose gateway uses
  # JANUS_OLLAMA_COMPOSE_URL / host.docker.internal instead.
  host_base_url: http://127.0.0.1:11434

  models:
    # Must match `ollama list` and provider_model_id in the matching registry YAML.
    - tag: nemotron35lightning:latest
      pull: true
      display_name: Nemotron 3.5 Lightning (Local)

    - tag: llama3.1:8b
      pull: true
      display_name: Llama 3.1 8B (Local)

    - tag: qwen3:30b
      pull: true
      display_name: Qwen3 30B (Local)
