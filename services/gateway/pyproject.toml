[project]
name = "janus-gateway"
version = "0.1.0"
description = "Janus Model Gateway — the only path to inference"
requires-python = ">=3.12"
dependencies = [
    "janus-core",
    "janus-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "argon2-cffi>=23.1",
    "redis>=5.0",
]

[project.optional-dependencies]
telemetry = ["janus-core[telemetry]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway_app"]

[tool.uv.sources]
janus-core = { workspace = true }
janus-schemas = { workspace = true }
