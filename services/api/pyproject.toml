[project]
name = "janus-api"
version = "0.1.0"
description = "Janus control plane: identity, organizations, and platform APIs"
requires-python = ">=3.12"
dependencies = [
    "janus-core",
    "janus-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
telemetry = ["janus-core[telemetry]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api_app"]

[tool.uv.sources]
janus-core = { workspace = true }
janus-schemas = { workspace = true }
