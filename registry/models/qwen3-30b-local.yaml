# Local Qwen3 30B served by Ollama.
#
# Pull:  ollama pull qwen3:30b
# (also ensured by ./install.sh ensure-models / setup.sh --local)
#
# Context and capability figures are published estimates, not Janus-evaluated.
slug: janus/qwen3-30b
display_name: Qwen3 30B (Local)
provider: alibaba
family: qwen
version: "3"
parameters: 30B
type: chat
tier: open_source
context_window: 131072
max_output_tokens: 8192
languages: [en, zh, de, fr, es, ru, ja, ko, ar, pt, it]
capabilities:
  - streaming
  - reasoning
  - coding
  - tool_calling
  - long_context
  - multilingual
cost_class: free
latency_class: medium
status: active
metadata_verified: false
aliases:
  - janus/qwen3
notes: >-
  Local Ollama deployment of Qwen3 30B. Effective context depends on available
  unified memory and Ollama num_ctx. Large weights — first pull can take a long time.
license:
  name: Apache-2.0
  commercial_use: true
deployments:
  - key: ollama-qwen3-30b
    backend: ollama
    protocol: openai_compatible
    deployment_type: local_dev
    privacy_level: local
    endpoint: ${JANUS_OLLAMA_BASE_URL:-http://localhost:11434/v1}
    provider_model_id: qwen3:30b
    max_context: 32768
    max_concurrency: 1
    priority: 55
    hardware:
      accelerator: gpu
      runtime: ollama
    initial_health: ready
